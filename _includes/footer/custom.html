<script>
(function () {
  // Browsers that support native cross-document view transitions handle the
  // whole crossfade themselves (see @view-transition in main.scss) — skip
  // the manual fade-then-navigate dance entirely so links stay instant.
  if ('startViewTransition' in document) return;

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var FADE_MS = reduceMotion ? 0 : 120;

  function fadeTarget() {
    return document.querySelector('#main > article.page, #main > .archive');
  }

  var target = fadeTarget();
  if (target) target.classList.add('fade-in');

  document.addEventListener('click', function (e) {
    var link = e.target.closest('a');
    if (!link || !link.href) return;
    if (link.target === '_blank' || link.hasAttribute('download')) return;
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

    var url;
    try { url = new URL(link.href, window.location.href); } catch (err) { return; }

    if (url.origin !== window.location.origin) return;
    if (url.pathname === window.location.pathname && url.hash) return;

    var current = fadeTarget();
    if (!current) return;

    e.preventDefault();
    current.classList.remove('fade-in');
    current.classList.add('fade-out');
    setTimeout(function () {
      window.location = link.href;
    }, FADE_MS);
  });

  window.addEventListener('pageshow', function (e) {
    if (e.persisted) {
      var restored = fadeTarget();
      if (restored) {
        restored.classList.remove('fade-out');
        restored.classList.add('fade-in');
      }
    }
  });
})();
</script>
