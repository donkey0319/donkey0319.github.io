<a href="{{ include.link }}" class="portfolio-glass-card" style="display:flex; flex-direction:column; height:100%; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid rgba(217,119,87,0.25); box-shadow:0 4px 24px rgba(20,20,19,0.35); border-radius:10px; padding:1.5rem; text-decoration:none;">
  <img src="{{ include.image }}" alt="{{ include.title }}" style="margin-bottom:0.5rem; width:100%; height:200px; object-fit:cover; border-radius:6px;">
  <p style="text-align:center; color:#faf9f5;">{{ include.title }}</p>
</a>
